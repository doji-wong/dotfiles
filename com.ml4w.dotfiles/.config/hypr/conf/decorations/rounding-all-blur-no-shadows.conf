# -----------------------------------------------------
# General window decoration
# name: "Rounding All Blur No Shadows"
# -----------------------------------------------------

decoration {
    rounding = 10
    active_opacity = 0.9
    inactive_opacity = 0.6
    fullscreen_opacity = 0.9

    # NEW: All blur settings MUST be inside this sub-block
    blur {
        enabled = true
        size = 3
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }

    # NEW: All shadow settings MUST be inside this sub-block
    shadow {
        enabled = false
        range = 30
        render_power = 3
        color = 0x66000000
    }
}
